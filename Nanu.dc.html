<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Nanu · Cari Nama Bayi Bermakna</title>
<meta name="description" content="Nanu — temukan ide nama bayi bermakna dari khazanah Jawa Kuno, Sansekerta, dan Islami, lengkap dengan artinya. Gratis dan mudah dipakai.">
<link rel="canonical" href="https://inspirasinama.xyz/">
<meta property="og:type" content="website">
<meta property="og:site_name" content="Nanu">
<meta property="og:title" content="Nanu · Cari Nama Bayi Bermakna">
<meta property="og:description" content="Temukan ide nama bayi bermakna (Jawa Kuno, Sansekerta, Islami) lengkap dengan artinya.">
<meta property="og:url" content="https://inspirasinama.xyz/">
<meta property="og:image" content="https://inspirasinama.xyz/assets/nanu-logo.png">
<meta name="twitter:card" content="summary">
<meta name="twitter:title" content="Nanu · Cari Nama Bayi Bermakna">
<meta name="twitter:description" content="Temukan ide nama bayi bermakna lengkap dengan artinya.">
<meta name="twitter:image" content="https://inspirasinama.xyz/assets/nanu-logo.png">
<script src="./support.js"></script>
<script defer src="/nanu-chrome.js"></script>
</head>
<body>
<nanu-navbar></nanu-navbar>
<x-dc>
<helmet>
<link rel="icon" type="image/svg+xml" href="/favicon-nanu.svg">
<script defer src="/_vercel/insights/script.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="">
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;700;800&amp;family=Plus+Jakarta+Sans:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://app.midtrans.com/snap/snap.js" data-client-key="Mid-client-YU7xfUUHpcNsevRU"></script>
<style>
  *{box-sizing:border-box}
  html,body{margin:0;padding:0}
  body{font-family:'Plus Jakarta Sans',system-ui,sans-serif;-webkit-font-smoothing:antialiased;background:#F9EFEB;color:#0B2A3A}
  button{font-family:inherit}
  input{font-family:inherit}
  ::placeholder{color:#A9B3B8}
  @keyframes nanuSpin{to{transform:rotate(360deg)}}
  @keyframes nanuPop{from{transform:translateY(16px) scale(.98)}to{transform:none}}
  @keyframes nanuToast{from{transform:translate(-50%,16px)}to{transform:translate(-50%,0)}}
</style>
</helmet>

<div style="display:flex;flex-direction:column;flex:1">

  <main style="flex:1;width:100%">
    <div style="max-width:720px;width:100%;margin:0 auto;padding:48px 20px 80px">

      <h1 style="font-family:'Baloo 2',cursive;font-weight:700;font-size:clamp(30px,6vw,46px);line-height:1.08;text-align:center;margin:0 0 14px;letter-spacing:-.01em">
        Cari nama <span style="color:#3CA274">bermakna</span><br>untuk <span style="color:#EE5B3A">si kecil</span>
      </h1>

      <div style="background:#fff;border:1px solid #EDE2DC;border-radius:26px;padding:clamp(20px,4vw,30px);box-shadow:0 18px 50px -28px rgba(11,42,58,.3)">

        <!-- keyword -->
        <label style="display:block;font-weight:700;font-size:14px;margin-bottom:9px;color:#0B2A3A">Kata kunci arti / makna <span style="color:#8A969C;font-weight:500">· opsional</span></label>
        <div style="position:relative;margin-bottom:26px">
          <span style="position:absolute;left:16px;top:50%;transform:translateY(-50%);color:#A9B3B8;display:flex">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><circle cx="11" cy="11" r="7"></circle><path d="m20 20-3.2-3.2"></path></svg>
          </span>
          <input value="{{ keyword }}" onChange="{{ onKeyword }}" onKeyDown="{{ onKeywordKey }}" placeholder="mis. cahaya, keberanian, kebijaksanaan" style="width:100%;padding:15px 16px 15px 46px;border:2px solid #EDE2DC;border-radius:15px;font-size:16px;color:#0B2A3A;outline:none;background:#FCF7F4" style-focus="border-color:#3CA274;background:#fff">
        </div>

        <!-- origin -->
        <label style="display:block;font-weight:700;font-size:14px;margin-bottom:9px;color:#0B2A3A">Asal nama</label>
        <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:11px;margin-bottom:26px">
          <sc-for list="{{ originOptions }}" as="opt" hint-placeholder-count="3">
            <button onClick="{{ opt.onClick }}" style="{{ opt.cardStyle }}">
              <span style="{{ opt.dotStyle }}"></span>
              <span style="display:flex;flex-direction:column;gap:1px;min-width:0">
                <span style="font-weight:700;font-size:15px;color:#0B2A3A">{{ opt.label }}</span>
                <span style="font-size:12px;color:#8A969C">{{ opt.desc }}</span>
              </span>
            </button>
          </sc-for>
        </div>

        <!-- length + gender -->
        <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:24px;margin-bottom:30px">
          <div>
            <label style="display:block;font-weight:700;font-size:14px;margin-bottom:9px;color:#0B2A3A">Panjang nama</label>
            <div style="display:flex;gap:9px;flex-wrap:wrap">
              <sc-for list="{{ lengthOptions }}" as="opt" hint-placeholder-count="2">
                <button onClick="{{ opt.onClick }}" style="{{ opt.style }}">{{ opt.label }}</button>
              </sc-for>
            </div>
          </div>
          <div>
            <label style="display:block;font-weight:700;font-size:14px;margin-bottom:9px;color:#0B2A3A">Jenis kelamin</label>
            <div style="display:flex;gap:9px;flex-wrap:wrap">
              <sc-for list="{{ genderOptions }}" as="opt" hint-placeholder-count="2">
                <button onClick="{{ opt.onClick }}" style="{{ opt.style }}">{{ opt.label }}</button>
              </sc-for>
            </div>
          </div>
        </div>

        <button onClick="{{ doSearch }}" style="{{ ctaStyle }}" style-hover="filter:brightness(1.05);transform:translateY(-1px)">
          <sc-if value="{{ searching }}">
            <span style="width:20px;height:20px;border:2.5px solid rgba(255,255,255,.45);border-top-color:#fff;border-radius:50%;animation:nanuSpin .8s linear infinite"></span>
            Mencari nama…
          </sc-if>
          <sc-if value="{{ notSearching }}" hint-placeholder-val="{{ true }}">
            Carikan Nama
          </sc-if>
        </button>
      </div>

      <sc-if value="{{ showExamples }}" hint-placeholder-val="{{ true }}">
        <div style="margin-top:26px;text-align:center">
          <p style="font-size:13px;color:#8A969C;margin:0 0 12px;font-weight:600">Coba kata kunci populer</p>
          <div style="display:flex;flex-wrap:wrap;gap:9px;justify-content:center">
            <sc-for list="{{ exampleChips }}" as="chip" hint-placeholder-count="6">
              <button onClick="{{ chip.onClick }}" style="background:#fff;border:1px solid #EDE2DC;color:#0B2A3A;font-weight:600;font-size:13px;padding:8px 15px;border-radius:999px;cursor:pointer" style-hover="border-color:#185FA4;color:#185FA4">{{ chip.label }}</button>
            </sc-for>
          </div>
        </div>
      </sc-if>
    </div>
  </main>


  <!-- ============ LOGIN MODAL ============ -->
  <sc-if value="{{ showLogin }}">
    <div onClick="{{ closeLogin }}" style="position:fixed;inset:0;z-index:60;background:rgba(11,42,58,.5);backdrop-filter:blur(3px);display:flex;align-items:center;justify-content:center;padding:20px">
      <div onClick="{{ stop }}" style="background:#fff;border-radius:26px;max-width:380px;width:100%;padding:34px 30px;text-align:center;animation:nanuPop .28s cubic-bezier(.2,.8,.3,1) both;box-shadow:0 30px 70px -20px rgba(11,42,58,.4)">
        <img src="assets/nanu-logo.png" alt="Nanu" style="height:30px;margin:0 auto 22px;display:block">
        <h3 style="font-family:'Baloo 2',cursive;font-weight:700;font-size:23px;margin:0 0 8px">{{ loginTitle }}</h3>
        <p style="color:#5C6B72;font-size:14.5px;line-height:1.55;margin:0 0 26px">{{ loginMsg }}</p>
        <button onClick="{{ doLogin }}" style="width:100%;display:flex;align-items:center;justify-content:center;gap:11px;background:#fff;border:2px solid #EDE2DC;border-radius:14px;padding:14px;font-weight:700;font-size:15px;color:#0B2A3A;cursor:pointer" style-hover="border-color:#185FA4;background:#FCF7F4">
          <svg width="20" height="20" viewBox="0 0 24 24"><path fill="#4285F4" d="M22.5 12.2c0-.7-.1-1.4-.2-2H12v3.8h5.9a5 5 0 0 1-2.2 3.3v2.7h3.5c2-1.9 3.3-4.7 3.3-7.8z"></path><path fill="#34A853" d="M12 23c3 0 5.5-1 7.3-2.7l-3.5-2.7c-1 .7-2.3 1.1-3.8 1.1-2.9 0-5.3-2-6.2-4.6H2.2v2.8A11 11 0 0 0 12 23z"></path><path fill="#FBBC05" d="M5.8 14.1a6.6 6.6 0 0 1 0-4.2V7.1H2.2a11 11 0 0 0 0 9.8z"></path><path fill="#EA4335" d="M12 5.4c1.6 0 3 .6 4.2 1.6l3.1-3.1A11 11 0 0 0 2.2 7.1l3.6 2.8C6.7 7.3 9.1 5.4 12 5.4z"></path></svg>
          Lanjutkan dengan Google
        </button>
        <button onClick="{{ closeLogin }}" style="background:none;border:none;color:#8A969C;font-weight:600;font-size:13.5px;margin-top:16px;cursor:pointer">Nanti saja</button>
      </div>
    </div>
  </sc-if>

  <!-- ============ UPGRADE / PAYMENT MODAL ============ -->
  <sc-if value="{{ showUpgrade }}">
    <div onClick="{{ closeUpgrade }}" style="position:fixed;inset:0;z-index:60;background:rgba(11,42,58,.5);backdrop-filter:blur(3px);display:flex;align-items:center;justify-content:center;padding:20px">
      <div onClick="{{ stop }}" style="background:#fff;border-radius:26px;max-width:380px;width:100%;padding:34px 30px;text-align:center;animation:nanuPop .28s cubic-bezier(.2,.8,.3,1) both;box-shadow:0 30px 70px -20px rgba(11,42,58,.4)">
        <div style="width:60px;height:60px;border-radius:50%;background:#FDEAE4;display:flex;align-items:center;justify-content:center;margin:0 auto 18px">
          <svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="#EE5B3A" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2 15 9l7 .5-5.5 4.5L18 21l-6-3.8L6 21l1.5-7L2 9.5 9 9z"></path></svg>
        </div>
        <h3 style="font-family:'Baloo 2',cursive;font-weight:700;font-size:23px;margin:0 0 8px">{{ upgradeTitle }}</h3>
        <p style="color:#5C6B72;font-size:14.5px;line-height:1.55;margin:0 0 18px">{{ upgradeMsg }}</p>
        <div style="font-family:'Baloo 2',cursive;font-weight:800;font-size:30px;color:#0B2A3A;margin-bottom:4px">{{ priceText }}</div>
        <p style="color:#8A969C;font-size:12.5px;margin:0 0 22px">Sekali bayar &middot; QRIS / e-wallet / kartu</p>
        <button onClick="{{ startPayment }}" style="width:100%;display:flex;align-items:center;justify-content:center;gap:10px;background:#EE5B3A;border:none;color:#fff;font-family:'Baloo 2',cursive;font-weight:700;font-size:16px;padding:14px;border-radius:14px;cursor:pointer" style-hover="filter:brightness(1.05)">
          <sc-if value="{{ paying }}"><span style="width:18px;height:18px;border:2.5px solid rgba(255,255,255,.5);border-top-color:#fff;border-radius:50%;animation:nanuSpin .8s linear infinite"></span> Memproses…</sc-if>
          <sc-if value="{{ notPaying }}">Bayar dengan QRIS</sc-if>
        </button>
        <button onClick="{{ closeUpgrade }}" style="background:none;border:none;color:#8A969C;font-weight:600;font-size:13.5px;margin-top:16px;cursor:pointer">Nanti saja</button>
      </div>
    </div>
  </sc-if>

  <!-- ============ TOAST ============ -->
  <sc-if value="{{ hasToast }}">
    <div style="position:fixed;bottom:26px;left:50%;transform:translateX(-50%);z-index:80;background:#0B2A3A;color:#fff;font-weight:600;font-size:14px;padding:13px 22px;border-radius:999px;box-shadow:0 14px 40px -12px rgba(11,42,58,.6);animation:nanuToast .3s ease both;white-space:nowrap">{{ toast }}</div>
  </sc-if>

</div>
</x-dc>
<nanu-footer>
  <a href="/privasi">Kebijakan Privasi</a>
  <a href="/ketentuan">Ketentuan Layanan</a>
  <a href="/faq">Tanya Jawab</a>
</nanu-footer>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:&quot;100%&quot;,&quot;height&quot;:720},&quot;ctaColor&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;Red Truck&quot;,&quot;Green Grass&quot;,&quot;Blue Sky&quot;],&quot;default&quot;:&quot;Green Grass&quot;,&quot;tsType&quot;:&quot;string&quot;,&quot;section&quot;:&quot;Tampilan&quot;},&quot;showExamples&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:true,&quot;tsType&quot;:&quot;boolean&quot;,&quot;section&quot;:&quot;Tampilan&quot;}}">
class Component extends DCLogic {
  state = {
    keyword: '', origin: 'jawa', length: '2', gender: 'lk',
    user: null, premium: false, showLogin: false, toast: '', searching: false,
    loginTitle: 'Masuk ke Nanu',
    loginMsg: 'Simpan & kelola nama favoritmu agar bisa diakses kapan saja dari perangkat mana pun.',
    // Paywall di beranda: cegat limit sebelum pindah halaman agar modal tampil
    // di atas beranda (bukan di atas daftar nama yang kosong).
    accessToken: null, blocked: false, showUpgrade: false, upgradeReason: 'limit', paying: false,
  };

  componentDidMount() {
    // Navbar bersama (nanu-chrome.js) minta login → pakai modal kontekstual halaman ini.
    this._onLogin = (e) => { e.preventDefault(); this.promptLogin('Masuk ke Nanu', 'Simpan & kelola nama favoritmu agar bisa diakses kapan saja dari perangkat mana pun.'); };
    document.addEventListener('nanu:login', this._onLogin);
    // Simpan promise-nya: doSearch() menunggunya agar keputusan paywall tidak
    // diambil sebelum status login & kuota diketahui.
    this._ready = this.initAuth();
  }

  componentWillUnmount() { document.removeEventListener('nanu:login', this._onLogin); }

  syncPremium(p) { document.dispatchEvent(new CustomEvent('nanu:premium', { detail: { premium: !!p } })); }

  async initAuth() {
    try {
      const m = await import('./nanu-supabase.js');
      this._sb = m;
      const user = await m.getUser();
      if (!user) return;
      const [premium, accessToken] = await Promise.all([m.isPremium(), m.getAccessToken()]);
      this.setState({ user, premium, accessToken });
      this.syncPremium(premium);
      if (!premium) await this.refreshQuota(accessToken);
    } catch (e) { /* biarkan: gate asli tetap ada di server */ }
  }

  // Tahu lebih dulu apakah generate berikutnya akan diblokir (read-only, tak memakai jatah).
  async refreshQuota(token) {
    if (!token) return;
    try {
      const r = await fetch('/api/quota', { headers: { Authorization: 'Bearer ' + token } });
      const d = await r.json();
      this.setState({ blocked: !!d.blocked, premium: !!d.premium });
      if (d.premium) this.syncPremium(true);
    } catch (e) { /* fail-open: gate asli tetap di server saat generate */ }
  }

  freeUsesLocal() { try { return parseInt(localStorage.getItem('nanu_free_uses') || '0', 10) || 0; } catch (e) { return 0; } }

  // Analytics event (Vercel Web Analytics) — aman kalau script belum termuat.
  track(name) { try { if (window.va) window.va('event', { name }); } catch (e) {} }

  doLogin() {
    if (!this._sb) return;
    const u = new URL(window.location.href);
    ['error', 'error_description', 'order_id', 'status_code', 'transaction_status', 'sb'].forEach((k) => u.searchParams.delete(k));
    u.hash = '';
    this._sb.signInWithGoogle(u.origin + u.pathname + u.search);
  }

  showToast(msg) {
    this.setState({ toast: msg });
    clearTimeout(this._t);
    this._t = setTimeout(() => this.setState({ toast: '' }), 2600);
  }

  setField(k, v) { this.setState({ [k]: v }); }
  originLabel(id) { return { jawa: 'Jawa Kuno', sansekerta: 'Sansekerta', islami: 'Islami' }[id]; }
  onKeywordKey(e) { if (e.key === 'Enter') this.doSearch(); }

  async doSearch() {
    if (this.state.searching) return;
    this.setState({ searching: true });

    // Pastikan status login + kuota sudah diketahui sebelum memutuskan paywall,
    // agar tidak salah menilai (mis. user login dianggap anonim).
    if (this._ready) { try { await this._ready; } catch (e) {} }

    // Cegat limit DI SINI supaya modal muncul di atas beranda — user tak pernah
    // mendarat di halaman hasil yang kosong tanpa tahu sebabnya.
    const st = this.state;
    if (!st.premium) {
      if (!st.user && this.freeUsesLocal() >= 2) {
        this.setState({ searching: false });
        this.track('paywall_login');
        this.promptLogin('Batas gratis kamu sudah habis', 'Kamu sudah memakai 2 pencarian gratis. Masuk untuk lanjut mencari nama — atau langsung Premium agar tanpa batas.');
        return;
      }
      if (st.user && st.blocked) {
        this.setState({ searching: false });
        this.track('paywall_upgrade');
        this.openUpgrade('limit');
        return;
      }
    }

    const { origin, length, gender } = this.state;
    const kw = this.state.keyword.trim();
    const params = { origin, length, gender, keyword: kw };
    try { localStorage.setItem('nanu_query', JSON.stringify(params)); } catch (e) {}
    const p = new URLSearchParams({ origin, length, gender });
    if (kw) p.set('keyword', kw);
    const url = '/daftar-nama?' + p.toString();
    // Tampilkan loading dulu, beri React waktu repaint, baru pindah halaman.
    this.setState({ searching: true });
    setTimeout(() => { window.location.href = url; }, 120);
  }

  // Buka modal login dengan teks sesuai konteks (simpan / kena limit / dll).
  promptLogin(title, msg) {
    this.setState({
      showLogin: true,
      loginTitle: title || 'Masuk ke Nanu',
      loginMsg: msg || 'Simpan & kelola nama favoritmu agar bisa diakses kapan saja dari perangkat mana pun.',
    });
  }
  closeLogin() { this.setState({ showLogin: false }); }
  stop(e) { e.stopPropagation(); }

  // ===== Pembayaran Midtrans (QRIS) — sama seperti di halaman hasil =====
  // reason: 'limit' (jatah habis) | 'more' (upgrade proaktif) → menentukan copy modal.
  openUpgrade(reason) { this.setState({ showUpgrade: true, upgradeReason: reason || 'limit' }); }
  closeUpgrade() { if (!this.state.paying) this.setState({ showUpgrade: false }); }

  async startPayment() {
    if (!this.state.user) { this.setState({ showUpgrade: false }); this.promptLogin('Masuk ke Nanu', 'Masuk dulu untuk melanjutkan pembayaran.'); return; }
    if (!window.snap) { this.showToast('Pembayaran belum siap, coba lagi sebentar'); return; }
    this.track('checkout_start');
    this.setState({ paying: true });
    try {
      const token = this.state.accessToken || (this._sb && await this._sb.getAccessToken());
      const resp = await fetch('/api/payment/create', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json', Authorization: 'Bearer ' + token },
      });
      const data = await resp.json();
      if (data.alreadyPremium) { this.setState({ premium: true, blocked: false, paying: false, showUpgrade: false }); this.syncPremium(true); this.showToast('Kamu sudah premium'); return; }
      if (!resp.ok || !data.token) throw new Error(data.detail || data.error || 'create-failed');
      this.setState({ paying: false });
      window.snap.pay(data.token, {
        onSuccess: () => this.afterPay(data.orderId),
        onPending: () => this.afterPay(data.orderId),
        onError: () => this.showToast('Pembayaran gagal'),
        onClose: () => this.showToast('Jendela pembayaran ditutup'),
      });
    } catch (e) {
      this.setState({ paying: false });
      this.showToast('Gagal memulai pembayaran');
    }
  }

  async afterPay(orderId) {
    this.setState({ showUpgrade: false });
    this.showToast('Memverifikasi pembayaran…');
    for (let i = 0; i < 12; i++) {
      await new Promise((r) => setTimeout(r, 2000));
      try {
        const token = this.state.accessToken || (this._sb && await this._sb.getAccessToken());
        const r = await fetch('/api/payment/status?order_id=' + encodeURIComponent(orderId), { headers: { Authorization: 'Bearer ' + token } });
        const d = await r.json();
        if (d.premium) {
          this.track('purchase');
          this.setState({ premium: true, blocked: false });
          this.syncPremium(true);
          this.showToast('Pembayaran berhasil · cari nama tanpa batas');
          return;
        }
      } catch (e) {}
    }
    this.showToast('Pembayaran sedang diproses, tunggu sebentar lalu coba lagi');
  }

  renderVals() {
    const st = this.state;
    const ctaColors = { 'Red Truck': '#EE5B3A', 'Green Grass': '#3CA274', 'Blue Sky': '#185FA4' };
    const ctaC = ctaColors[this.props.ctaColor] || '#3CA274';

    const O = [
      { id: 'jawa', label: 'Jawa Kuno', desc: 'Klasik & berwibawa', color: '#3CA274' },
      { id: 'sansekerta', label: 'Sansekerta', desc: 'Agung & filosofis', color: '#185FA4' },
      { id: 'islami', label: 'Islami', desc: 'Penuh berkah', color: '#F6BE2D' },
    ];
    const originOptions = O.map(o => {
      const active = st.origin === o.id;
      return {
        label: o.label, desc: o.desc,
        onClick: () => this.setField('origin', o.id),
        cardStyle: 'display:flex;align-items:center;gap:11px;text-align:left;cursor:pointer;padding:13px 15px;border-radius:16px;background:#fff;border:2px solid ' + (active ? o.color : '#EDE2DC') + ';box-shadow:' + (active ? '0 8px 20px -10px ' + o.color : '0 1px 2px rgba(11,42,58,.04)') + ';transition:all .15s',
        dotStyle: 'width:14px;height:14px;border-radius:50%;flex:0 0 auto;background:' + o.color,
      };
    });

    const pill = (active, color) => 'padding:10px 18px;border-radius:999px;cursor:pointer;font-weight:600;font-size:15px;transition:all .15s;border:2px solid ' + (active ? color : '#EDE2DC') + ';background:' + (active ? color : '#fff') + ';color:' + (active ? '#fff' : '#0B2A3A');
    const lengthOptions = [{ id: '2', label: '2 Kata' }, { id: '3', label: '3 Kata' }].map(o => ({
      label: o.label, onClick: () => this.setField('length', o.id), style: pill(st.length === o.id, '#3CA274'),
    }));
    const genderOptions = [{ id: 'lk', label: 'Laki-laki' }, { id: 'pr', label: 'Perempuan' }].map(o => ({
      label: o.label, onClick: () => this.setField('gender', o.id), style: pill(st.gender === o.id, '#185FA4'),
    }));

    const exampleChips = ['Cahaya', 'Keberanian', 'Kebijaksanaan', 'Cinta kasih', 'Bintang', 'Anugerah'].map(w => ({
      label: w, onClick: () => this.setField('keyword', w),
    }));

    // Copy modal upgrade dibedakan: sudah kena limit vs upgrade proaktif.
    const limitHit = st.upgradeReason === 'limit';

    return {
      keyword: st.keyword,
      onKeyword: (e) => this.setField('keyword', e.target.value),
      onKeywordKey: (e) => this.onKeywordKey(e),
      originOptions, lengthOptions, genderOptions, exampleChips,
      showExamples: this.props.showExamples !== false,
      ctaStyle: 'width:100%;display:flex;align-items:center;justify-content:center;gap:10px;background:' + ctaC + ';border:none;color:#fff;font-family:\'Baloo 2\',cursive;font-weight:700;font-size:18px;padding:16px;border-radius:16px;cursor:pointer;box-shadow:0 12px 26px -12px ' + ctaC + ';transition:all .15s',
      doSearch: () => this.doSearch(),
      searching: st.searching,
      notSearching: !st.searching,

      showLogin: st.showLogin,
      loginTitle: st.loginTitle,
      loginMsg: st.loginMsg,
      closeLogin: () => this.closeLogin(),
      doLogin: () => this.doLogin(),

      showUpgrade: st.showUpgrade,
      upgradeTitle: limitHit ? 'Jatah gratis kamu sudah habis' : 'Buka nama tak terbatas',
      upgradeMsg: limitHit
        ? 'Kamu sudah memakai semua pencarian gratis. Upgrade Premium untuk mencari nama tanpa batas.'
        : 'Sekali bayar, buka ribuan inspirasi nama — berlaku selamanya.',
      priceText: 'Rp 30.000',
      paying: st.paying,
      notPaying: !st.paying,
      closeUpgrade: () => this.closeUpgrade(),
      startPayment: () => this.startPayment(),
      stop: (e) => this.stop(e),

      hasToast: !!st.toast,
      toast: st.toast,
    };
  }
}
</script>
</body>
</html>
